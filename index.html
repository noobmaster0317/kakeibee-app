<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>江藤家の家計簿</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f8f8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style id="shell-style">
:root{--teal:#00897b;--ink:#1d2d35;--muted:#6b7a83;--line:#e3e9ec;--alert:#d0533f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#f6f8f8;color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.wrap{min-height:100%;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
.card{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 1px 2px #12343508,0 10px 30px #1234350f;animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.98)}}
.logo{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 12px;box-shadow:0 6px 16px #00897b33}
h1{font-size:20px;text-align:center;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;text-align:center;margin:0 0 20px}
ol{margin:0 0 18px;padding-left:1.3em;font-size:14px}ol li{margin:4px 0}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fbfcfc;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--teal);box-shadow:0 0 0 4px #00897b1f}
#code{font:700 26px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3em;text-align:center}
button{width:100%;margin-top:20px;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;background:var(--teal);color:#fff;min-height:50px;cursor:pointer;transition:transform .15s,opacity .2s}
button:active{transform:scale(.98)}button:disabled{opacity:.5}
button.ghost{background:transparent;color:var(--teal);margin-top:8px;font-size:13px;min-height:auto;padding:8px}
.err{color:var(--alert);font-size:13px;margin:12px 0 0;min-height:1em}
.share{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:#eef3f6;vertical-align:-5px}
.loading{display:grid;place-items:center;gap:16px;text-align:center;color:var(--muted);font-size:13px}
.ring{width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--teal) 0 30%,#00897b22 30% 100%);-webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,#0000 calc(100% - 6px),#000 calc(100% - 5px));animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="screen">
  <div class="loading" id="loading"><div class="ring"></div><div>家計簿を準備しています</div></div>
</div>
<noscript>JavaScriptを有効にしてください。</noscript>
<script>
// app.js が読み込めないときの逃げ道（15秒たっても準備中のままなら案内を出す）
setTimeout(function(){var l=document.getElementById('loading');if(l&&!window.__kbShell){l.insertAdjacentHTML('beforeend','<div style="max-width:320px"><p>アプリの部品を読み込めませんでした。電波を確認して、もう一度お試しください。</p><button type="button" onclick="location.reload()">もう一度試す</button></div>');}},15000);
</script>
<script src="config.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
